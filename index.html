/* 사진 형식 사이드바 */
:root{--kp-cat-bg:#2E2614;--kp-cat-fg:#F3E3B5;--kp-box-fg:#FF8A8A}
:root[data-theme="light"]{--kp-cat-bg:#FDF2CC;--kp-cat-fg:#0E0F10;--kp-box-fg:#C0262D}
.kp-side{padding:0;gap:0;overflow:auto}
.kp-nav-group{padding:12px 12px 6px;font-size:12px;font-weight:700;color:var(--color-fg-muted);border-bottom:1px solid var(--color-border-line)}
.kp-nav-item{border-radius:0;min-height:38px;padding:7px 12px;border-bottom:1px solid var(--color-border-line);gap:8px}
.kp-nav-home{font-weight:700;color:var(--color-fg)}
.kp-nav-cat{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--kp-cat-bg);color:var(--kp-cat-fg);font-size:13px;line-height:18px;font-weight:700;border-bottom:1px solid var(--color-border-line)}
.kp-nav-catbtn{color:var(--kp-cat-fg)}
.kp-nav-catbtn:hover{background:var(--kp-cat-bg);filter:brightness(1.08);color:var(--kp-cat-fg)}
.kp-nav-catbtn.is-active{background:var(--kp-cat-bg);box-shadow:inset 3px 0 0 var(--kp-accent);color:var(--kp-cat-fg)}
.kp-nav-sub{padding-left:20px}
.kp-nav-sub.is-active,.kp-nav-home.is-active{box-shadow:inset 3px 0 0 var(--kp-accent)}
.kp-box{flex:none;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border:1px solid currentColor;font:700 11px/1 var(--font-anthropic-sans);letter-spacing:0}
.kp-nav-cat .kp-box{color:var(--kp-cat-fg)}
.kp-code{flex:none;display:inline-flex;align-items:center;gap:1px;font-size:12px;color:var(--color-fg-muted);font-variant-numeric:tabular-nums}
.kp-code .kp-box{width:15px;height:15px;font-size:10px;color:var(--kp-box-fg);border-color:var(--kp-box-fg)}
.kp-box-home{border:0;font-size:14px}
.kp-nav-item.is-active .kp-no{background:var(--color-bg);color:var(--color-fg)}
.kp-table .kp-c{width:56px}
@media (max-width:900px){
 .kp-side{flex-direction:row;overflow-x:auto;gap:0}
 .kp-nav-cat:not(button){display:none}
 .kp-nav-item,.kp-nav-catbtn{flex:none;width:auto;white-space:nowrap;border-bottom:0;border-right:1px solid var(--color-border-line)}
 .kp-nav-sub{padding-left:12px}
}
.kp-head-actions{display:flex;align-items:center;gap:var(--cds-gap-sm);flex-wrap:wrap;justify-content:flex-end}

/* ===== 현재 실적 입력 영역 강조 ===== */

:root[data-theme="light"]{--kp-in-bg:#F1FBF6;--kp-in-line:color-mix(in srgb,var(--kp-accent) 60%,transparent);--kp-in-field:#FFFFFF}
.kp-fields{position:relative;background:var(--kp-in-bg);border:1.5px dashed var(--kp-in-line);border-radius:12px;padding:14px;margin-top:12px;gap:12px}
.kp-fields::before{content:"✎  현재 실적 입력 — 아래 칸에 숫자를 입력하세요";grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--color-ok);letter-spacing:-0.3px}
.kp-field label{color:var(--color-fg);font-weight:600;font-size:13px}
.kp-input{height:44px;background:var(--kp-in-field);border:1.5px solid var(--kp-in-line);font-size:16px;font-weight:700;color:var(--color-fg)}
.kp-input::placeholder{color:var(--color-fg-muted);font-weight:500;font-size:14px;opacity:1}
